<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ch1Q1</title>

<style>
:root{
  --bg:#E6EEE9;
  --text:#0B3D2E;
  --stroke:#cfe1da;
  --reveal:#ffffffee;

  --green1:#0B3D2E;
  --green2:#093427;
  --mid1:#1F6B52;
  --mid2:#16604a;

  --danger1:#7c1f1f;
  --danger2:#5a1414;

  --glow: 0 0 0 2px rgba(11,61,46,.15), 0 10px 30px rgba(11,61,46,.18);
  --glowStrong: 0 0 0 3px rgba(11,61,46,.25), 0 18px 40px rgba(11,61,46,.25);

  --grid-top: 18%;
  --grid-left: 6%;
  --grid-width: 88%;
  --grid-height: 36%;
  --pyr-gap: 3%;
  --frame-pad: 14px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:20px;
  font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial;
  background:#f4f4f4;
}

.stage{
  width:min(1100px,100%);
  aspect-ratio:16/9;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:var(--bg);
  border:1px solid var(--stroke);
  border-radius:14px;
  box-shadow:0 18px 55px rgba(0,0,0,.12);
}

.stage::before{
  content:"";
  position:absolute; inset:0;
  background-image:
    repeating-radial-gradient(circle at 30% 30%,
      rgba(11,61,46,.06) 0 1px,
      transparent 1px 28px),
    repeating-radial-gradient(circle at 70% 65%,
      rgba(11,61,46,.05) 0 1px,
      transparent 1px 32px);
  opacity:.50;
  pointer-events:none;
}

.stage::after{
  content:"";
  position:absolute; inset:-40px;
  background: radial-gradient(circle at center, transparent 55%, rgba(0,0,0,.10) 110%);
  pointer-events:none;
}

/* Box 1 */
.box1{
  position:absolute;
  top:22px;
  left:50%;
  transform:translateX(-50%);
  width:46%;
  height:9%;
  background:linear-gradient(180deg, var(--green1), var(--green2));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
  font-size:22px;
  cursor:pointer;
  user-select:none;
  border-radius:12px;
  box-shadow:var(--glow);
  z-index:3;
  padding:0 14px;
  text-align:center;
}
.box1:hover{ box-shadow:var(--glowStrong); transform:translateX(-50%) translateY(-1px); }
.box1.revealed{ cursor:default; }
.box1 span{
  width:100%;
  display:block;
  line-height:1.2;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;
  overflow:hidden;
}

/* Grid */
.mainGrid{
  position:absolute;
  top:var(--grid-top);
  left:var(--grid-left);
  width:var(--grid-width);
  height:var(--grid-height);
  display:grid;
  grid-template-columns: 20% 16% 22% 30%;
  grid-template-rows: repeat(3, 1fr);
  gap:18px 18px;
  align-items:stretch;
  z-index:2;
}

.label{
  font-weight:1000;
  font-size:clamp(20px, 1.8vw, 26px);
  text-align:center;
  color:var(--text);
  text-shadow:0 1px 0 rgba(255,255,255,.35);
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1.2;
  overflow:hidden;
  padding:4px 2px;
}

.gameBox{
  background:linear-gradient(180deg, var(--mid1), var(--mid2));
  color:#fff;
  border-radius:12px;
  cursor:pointer;
  user-select:none;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:1000;
  padding:10px 12px;
  min-height:56px;
  height:100%;
  box-shadow:var(--glow);
  transition:transform .15s ease, box-shadow .2s ease, filter .2s ease;
  overflow:hidden;
  position:relative;
}
.gameBox:hover{ transform:translateY(-2px); box-shadow:var(--glowStrong); filter:saturate(1.05); }

.gameBox .num{
  font-size:22px;
  line-height:1;
}

/* FIXED CLUE */
.gameBox .clue{
  display:none;
  width:100%;
  color:var(--text);
  line-height:1.3;
  white-space:pre-line;
  overflow-wrap:anywhere;
  word-break:break-word;
  font-size:16px;
  text-align:center;
  padding:2px 4px;
}

.gameBox.revealed{
  background:var(--reveal);
  color:var(--text);
  cursor:default;
  border:2px solid rgba(11,61,46,.35);
  box-shadow:0 0 0 3px rgba(11,61,46,.12), 0 16px 38px rgba(11,61,46,.18);
}
.gameBox.revealed .num{ display:none; }
.gameBox.revealed .clue{ display:block; }

.gameBox.disabled{ pointer-events:none; opacity:.65; }

/* HUD */
.msg{
  font-weight:1000;
  font-size:14px;
  padding:10px 12px;
  color:var(--text);
  background:rgba(255,255,255,.92);
  border:1px solid var(--stroke);
  border-radius:12px;
  box-shadow:0 8px 22px rgba(11,61,46,.08);
  line-height:1.45;
  min-height:48px;
  max-height:84px;
  overflow:auto;
  word-break:break-word;
  overflow-wrap:anywhere;
}
</style>
</head>

<body>
<!-- باقي الكود يبقى كما هو بدون أي تغيير -->
</body>
</html>
