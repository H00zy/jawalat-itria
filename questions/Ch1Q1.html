<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ch1Q1</title>

<style>
:root{
  --bg:#E6EEE9;
  --text:#0B3D2E;
  --stroke:#cfe1da;
  --reveal:#ffffffee;

  --green1:#0B3D2E;
  --green2:#093427;
  --mid1:#1F6B52;
  --mid2:#16604a;

  --danger1:#7c1f1f;
  --danger2:#5a1414;

  --glow: 0 0 0 2px rgba(11,61,46,.15), 0 10px 30px rgba(11,61,46,.18);
  --glowStrong: 0 0 0 3px rgba(11,61,46,.25), 0 18px 40px rgba(11,61,46,.25);

  --grid-top: 18%;
  --grid-left: 6%;
  --grid-width: 88%;
  --grid-height: 36%;
  --pyr-gap: 3%;
  --frame-pad: 14px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:20px;
  font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial;
  background:#f4f4f4;
}

.stage{
  width:min(1100px,100%);
  aspect-ratio:16/9;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:var(--bg);
  border:1px solid var(--stroke);
  border-radius:14px;
  box-shadow:0 18px 55px rgba(0,0,0,.12);
}

.stage::before{
  content:"";
  position:absolute; inset:0;
  background-image:
    repeating-radial-gradient(circle at 30% 30%,
      rgba(11,61,46,.06) 0 1px,
      transparent 1px 28px),
    repeating-radial-gradient(circle at 70% 65%,
      rgba(11,61,46,.05) 0 1px,
      transparent 1px 32px);
  opacity:.50;
}

.box1{
  position:absolute;
  top:22px;
  left:50%;
  transform:translateX(-50%);
  width:46%;
  height:9%;
  background:linear-gradient(180deg, var(--green1), var(--green2));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
  font-size:22px;
  cursor:pointer;
  border-radius:12px;
  box-shadow:var(--glow);
  z-index:3;
  padding:0 14px;
  text-align:center;
}

.mainGrid{
  position:absolute;
  top:var(--grid-top);
  left:var(--grid-left);
  width:var(--grid-width);
  height:var(--grid-height);
  display:grid;
  grid-template-columns: 20% 16% 22% 30%;
  grid-template-rows: repeat(3, 1fr);
  gap:18px;
}

.label{
  font-weight:1000;
  font-size:22px;
  text-align:center;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
}

.gameBox{
  background:linear-gradient(180deg, var(--mid1), var(--mid2));
  color:#fff;
  border-radius:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:1000;
  padding:10px;
  box-shadow:var(--glow);
  position:relative;
}

.gameBox .num{
  font-size:22px;
}

.gameBox .clue{
  display:none;
  width:100%;
  color:var(--text);
  line-height:1.3;
  white-space:pre-line;
  word-break:break-word;
  font-size:16px;
  text-align:center;
}

.gameBox.revealed{
  background:var(--reveal);
  color:var(--text);
  border:2px solid rgba(11,61,46,.35);
}

.gameBox.revealed .num{
  display:none;
}

.gameBox.revealed .clue{
  display:block;
}

.hud{
  position:absolute;
  left:var(--frame-pad);
  top: calc(var(--grid-top) + var(--grid-height) + 16px);
  width:420px;
}

.btn{
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-weight:700;
}

.msg{
  margin-top:10px;
  background:#fff;
  padding:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="stage">

<div class="box1" id="box1">1</div>

<div class="mainGrid">

<div class="label">الدار العطرية</div>
<div class="gameBox" data-id="2">
<div class="num">2</div>
<div class="clue"></div>
</div>

<div class="label">الافتتاحية</div>
<div class="gameBox" data-id="5">
<div class="num">5</div>
<div class="clue"></div>
</div>

<div class="label">العطار</div>
<div class="gameBox" data-id="3">
<div class="num">3</div>
<div class="clue"></div>
</div>

<div class="label">قلب العطر</div>
<div class="gameBox" data-id="6">
<div class="num">6</div>
<div class="clue"></div>
</div>

<div class="label">سنة الإصدار</div>
<div class="gameBox" data-id="4">
<div class="num">4</div>
<div class="clue"></div>
</div>

<div class="label">قاعدة العطر</div>
<div class="gameBox" data-id="7">
<div class="num">7</div>
<div class="clue"></div>
</div>

</div>

<div class="hud">
<button class="btn" id="wrongBtn">خطأ</button>
<button class="btn" id="resetBtn">إعادة السؤال</button>
<div class="msg" id="msg"></div>
</div>

</div>

<script>
const board = {
  perfumeName: "Kenzo Homme Indigo",
  clues: {
    2: "Kenzo",
    3: "Quentin Bisch",
    4: "2025",
    5: "نسيم البحر",
    6: "السوسن",
    7: "الجلود، خشب الصندل، أكيغالاوود"
  }
};

document.querySelectorAll(".gameBox").forEach(box=>{
  box.addEventListener("click", ()=>{
    const id = box.dataset.id;
    box.classList.add("revealed");
    box.querySelector(".clue").textContent = board.clues[id];
  });
});

document.getElementById("box1").onclick = ()=>{
  document.getElementById("box1").textContent = board.perfumeName;
};

document.getElementById("resetBtn").onclick = ()=>{
  location.reload();
};
</script>

</body>
</html>
